[package]
name = "djson"
version = "0.1.0"
edition = "2024"

[features]
pretty_ast = []

[[bench]]
name = "pretty"
harness = false
required-features = ["pretty_ast"]

[[bench]]
name = "tokenize"
harness = false

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "evaluate"
harness = false

[[bench]]
name = "pipeline"
harness = false

[dependencies]
clap.workspace = true
miette = { version = "7.6.0", features = ["fancy"] }
reedline = "0.51.0"
thiserror = "2.0.20"

[dev-dependencies]
criterion.workspace = true
insta.workspace = true

[lints]
workspace = true
