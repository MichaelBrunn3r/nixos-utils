[package]
name = "djson"
version = "0.1.0"
edition = "2024"

[features]
default = ["fmt_json", "fmt_yaml"]
pretty_ast = []
fmt_json = ["dep:serde_json"]
fmt_yaml = ["dep:serde_yaml"]

[[bench]]
name = "pretty"
harness = false
required-features = ["pretty_ast"]

[[bench]]
name = "tokenize"
harness = false

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "evaluate"
harness = false

[[bench]]
name = "pipeline"
harness = false

[dependencies]
clap.workspace = true
miette = { version = "7.6.0", features = ["fancy"] }
reedline = "0.51.0"
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
thiserror = "2.0.20"

[dev-dependencies]
criterion.workspace = true
insta.workspace = true

[lints]
workspace = true
